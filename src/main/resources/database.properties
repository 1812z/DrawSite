# Central database configuration. Supply passwords through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/drawsite}
spring.datasource.username=${DB_USERNAME:drawsite}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
