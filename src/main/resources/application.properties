spring.application.name=DrawSite
spring.config.import=classpath:database.properties,optional:file:./config/application-local.properties
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=false
mybatis-flex.configuration.map-underscore-to-camel-case=true
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.timeout=604800
sa-token.is-read-cookie=false
sa-token.is-read-body=false
sa-token.is-log=false
sa-token.is-print=false
sa-token.is-share=false
drawsite.workspace-root=${WORKSPACE_ROOT:./data/workspaces}
drawsite.sites-directory=${SITES_DIRECTORY:./data/sites}
drawsite.container-host=${CONTAINER_HOST:host.docker.internal}
drawsite.agent.max-tool-rounds=${AGENT_MAX_TOOL_ROUNDS:80}
drawsite.agent.max-tool-calls=${AGENT_MAX_TOOL_CALLS:240}
drawsite.agent.context-tokens=${AGENT_CONTEXT_TOKENS:200000}
